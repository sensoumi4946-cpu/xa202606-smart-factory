[project]
name = "smart-factory-analytics"
version = "0.1.0"
description = "Analytics and mock data tools for XA-202606 Smart Factory platform"
requires-python = ">=3.11"
dependencies = [
    "paho-mqtt>=2.0",
    "smart-factory-contracts",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/analytics"]
