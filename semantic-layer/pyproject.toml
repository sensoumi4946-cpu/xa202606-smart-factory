[project]
name = "smart-factory-semantic-layer"
version = "0.1.0"
description = "Semantic interoperability layer for XA-202606 Smart Factory platform"
requires-python = ">=3.11"
dependencies = [
    "rdflib>=6.0",
    "requests>=2.31.0",
    "httpx>=0.28",
    "pyshacl>=0.25.0",
    "smart-factory-contracts",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "rdflib>=6.0",
    "pyshacl>=0.25.0",
    "requests>=2.31.0",
]

[project.scripts]
sf-binding = "semantic_layer.binding_client:main"
sf-bindingd = "semantic_layer.binding_service:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/semantic_layer"]
